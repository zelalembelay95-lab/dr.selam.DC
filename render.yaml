services:
  - type: web
    name: dr-selam-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: dr-selam-site
    runtime: static
    rootDir: frontend
    buildCommand: echo "static"
    staticPublishPath: .
